name: Night timer
# Starts the league-table check every 30 min from 00:00 to 04:00 Nepal time (UTC+5:45).
# GitHub often skips scheduled runs, so this job stays alive around the clock (handing over to a
# fresh run every ~5 h 40 min) and starts "Post league tables" (only=night) itself at :00 and :30.
# Free for public repos. post.yml keeps its own 04:28 / 05:28 runs as a backup.
on:
  schedule:
    - cron: "17 */3 * * *"     # kick-starts every 3 h in case the chain ever breaks (extra copies just queue)
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: night-timer
  cancel-in-progress: false
jobs:
  timer:
    # only while the repo is public (Actions minutes are free); never burns private minutes
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Tick every 30 minutes, 00:00-04:00 Nepal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, os, subprocess, time
          from zoneinfo import ZoneInfo
          NPT = ZoneInfo("Asia/Kathmandu")
          START = time.time()
          LIMIT = 5 * 3600 + 40 * 60          # stay under the 6 h job limit, then hand over

          def now():
              return dt.datetime.now(NPT)

          def run(wf, **inputs):
              cmd = ["gh", "workflow", "run", wf, "--repo", os.environ["REPO"], "--ref", "main"]
              for k, v in inputs.items():
                  cmd += ["-f", f"{k}={v}"]
              print(now().strftime("%Y-%m-%d %H:%M:%S"), "start", wf, inputs, flush=True)
              for i in range(3):
                  if subprocess.run(cmd).returncode == 0:
                      return
                  time.sleep(20)

          def next_tick(t):
              base = t.replace(hour=0, minute=0, second=0, microsecond=0)
              for day in (0, 1):
                  for k in range(9):                 # 00:00, 00:30 ... 04:00
                      x = base + dt.timedelta(days=day, minutes=30 * k)
                      if x > t:
                          return x

          import json, base64

          def oneoffs():
              """Extra one-off posts listed in state/oneoff.json: [{"at": ISO time, "workflow": "post.yml", "inputs": {...}}]."""
              try:
                  out = subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/contents/state/oneoff.json"],
                                       capture_output=True, text=True, timeout=60).stdout
                  items = json.loads(base64.b64decode(json.loads(out)["content"]))
                  return [(dt.datetime.fromisoformat(i["at"]), i) for i in items]
              except Exception:
                  return []

          fired = set()
          STARTED = now()   # a one-off fires only in the run that was already alive at its time (never twice)
          # Runs all day: it sleeps until the next night tick (or one-off post) and hands over to a fresh run
          # before the 6 h job limit, so the chain never depends on GitHub's unreliable schedule.
          while True:
              n = now()
              tick = next_tick(n)
              events = [(t, i) for t, i in oneoffs() if t > STARTED and i["at"] not in fired]
              due = [x for x in events if x[0] <= n]
              for t, i in due:
                  fired.add(i["at"])
                  run(i.get("workflow", "post.yml"), **i.get("inputs", {}))
              upcoming = [t for t, i in events if t > n]
              nxt = min([tick] + upcoming)
              wait = (nxt - n).total_seconds()
              left = LIMIT - (time.time() - START)
              if wait > left:
                  time.sleep(max(0, left - 60))
                  print("Handing over to a fresh timer run before the 6 h limit.", flush=True)
                  run("night-timer.yml")
                  break
              print(f"next event at {nxt:%H:%M} Nepal (in {int(wait // 60)} min)", flush=True)
              time.sleep(min(max(0, wait), 1800))   # wake at least every 30 min to pick up new one-off posts
              if now() >= tick and tick <= nxt:
                  run("post.yml", only="night", dry_run="false")
          EOF
