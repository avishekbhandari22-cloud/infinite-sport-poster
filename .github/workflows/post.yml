name: Post league tables
# Times are UTC. Nepal = UTC+5:45.
# Europe + Saudi: checked every 30 min from 00:00 to 04:00 Nepal time; each league posts on its own
#   as soon as all of its matches for that day are finished.
# MLS: one run at 10:00 Nepal time (Inter Miami's conference), as before.
on:
  schedule:
    - cron: "15,45 18-21 * * *"   # 00:00, 00:30 ... 03:30 Nepal
    - cron: "15 22 * * *"         # 04:00 Nepal
    - cron: "15 4 * * *"          # 10:00 Nepal - MLS
  workflow_dispatch:
    inputs:
      only: { description: "optional league codes e.g. esp.1 or eng.1,esp.1", default: "" }
      force: { description: "true = ignore the 'all matches finished' check (testing)", default: "false" }
      dry_run: { description: "true = build only, do not post", default: "true" }
      gap_minutes: { description: "minutes between posts (manual runs)", default: "0" }
      ronaldo: { description: "true = add Ronaldo / Al Nassr line to the Saudi caption", default: "false" }
      style: { description: "picture: table or titlerace", default: "table" }
permissions:
  contents: write   # saves state/posted.json and the dry-run preview branch
concurrency:
  group: league-tables
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Which leagues have finished all their matches for the day?
        id: chk
        run: |
          if [ "${{ github.event.schedule }}" = "15 4 * * *" ]; then
            python matchday.py --check --only usa.1 --force
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python matchday.py --check --only eng.1,esp.1,ita.1,ger.1,fra.1,ksa.1
          else
            python matchday.py --check ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.force == 'true' && '--force' || '' }}
          fi
      - name: Install
        if: steps.chk.outputs.ready != ''
        run: pip install -r requirements.txt && sudo apt-get install -y fonts-dejavu-core >/dev/null
      - name: Build and post
        if: steps.chk.outputs.ready != ''
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          GAP=$(( ${{ inputs.gap_minutes || '0' }} * 60 )); [ "$GAP" -gt 0 ] || GAP=20
          python matchday.py --post "${{ steps.chk.outputs.ready }}" --gap $GAP ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ inputs.ronaldo == 'true' && '--ronaldo' || '' }} --style ${{ inputs.style || 'table' }}
      - name: Save which league days were posted
        if: ${{ always() && steps.chk.outputs.ready != '' && inputs.dry_run != 'true' }}
        run: |
          git config user.name "poster-bot"; git config user.email "poster-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git commit -qm "posted: ${{ steps.chk.outputs.ready }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Publish preview pictures (dry run only)
        if: ${{ inputs.dry_run == 'true' && steps.chk.outputs.ready != '' }}
        run: |
          mkdir -p /tmp/prev && cp out/*_main.png out/*_caption.txt /tmp/prev/ || true
          git config user.name "poster-bot"; git config user.email "poster-bot@users.noreply.github.com"
          git checkout -q --orphan preview
          git rm -rfq .
          cp /tmp/prev/* .
          git add -A && git commit -qm "dry-run preview" && git push -f origin preview
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.chk.outputs.ready != '' }}
        with: { name: tables, path: out/ }
